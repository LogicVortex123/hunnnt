services:
  jev:
    build:
      context: ../../agents/jev
      dockerfile: Dockerfile
    container_name: opportunity-jev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    tmpfs: ["/tmp"]
